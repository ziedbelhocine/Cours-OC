version: 2

models:
  - name: int_students_age
    description: Table regroupant le nombre d'étudiants par age et année.
    columns:
      - name: age_group
        description: groupe d'age auquel appartiennent les étudiants.
        data_tests:
          - not_null
      - name: year
        description: Année de début du parcours.
        data_tests:
          - not_null        
      - name: total_students
        description: Total d'étudiants de ce groupe d'age sur cetet année.
        data_tests:
          - not_null
      - name: pct_students_per_year
        description: Pourcentage du groupe d'étudiants par groupe d'age et année.
        data_tests:
          - not_null


  - name: int_students_region
    description: Table regroupant le nombre d'étudiants par region et année.
    columns:
      - name: region
        description: Région de résidence.
        data_tests:
          - not_null
      - name: year
        description: Année de début du parcours.
        data_tests:
          - not_null
      - name: total_students
        description: Total d'étudiants de ce groupe d'age sur cetet année.
        data_tests:
          - not_null
      - name: pct_students_per_year
        description: Pourcentage du groupe d'étudiants par region et année.
        data_tests:
          - not_null

  - name: int_students_gender
    description: Table regroupant le nombre d'étudiants par genre et année.
    columns:
      - name: gender
        description: genre déclaré de l'étudiant
        data_tests:
          - not_null
      - name: year
        description: Année de début du parcours.
        data_tests:
          - not_null
      - name: total_students
        description: Total d'étudiants de ce groupe d'age sur cetet année.
        data_tests:
          - not_null
      - name: pct_students_per_year
        description: Pourcentage du groupe d'étudiants par genre et année.
        data_tests:
          - not_null

  - name: int_insee_gender
    description: Table regroupant la population par genre et année.
    columns:
      - name: gender
        description: Genre de la population
        data_tests:
          - not_null
      - name: year
        description: année du recensement
        data_tests:
          - not_null
      - name: total_population
        description: Population totale sur cette année et ce genre
        data_tests:
          - not_null
      - name: pct_population_per_year
        description: Pourcentage de la population de ce genre sur l'année
        data_tests:
          - not_null
          
  - name: int_insee_age
    description: Table regroupant la population par age et année.
    columns:
      - name: year
        description: année du recensement
        data_tests:
          - not_null
      - name: age_group
        description: tranche d'age de la population
        data_tests:
          - not_null
      - name: population
        description: Population totale sur cette année et cet age
        data_tests:
          - not_null
      - name: pct_population_per_year
        description: Pourcentage de la population de cet age sur l'année
        data_tests:
          - not_null  
          
  - name: int_insee_region
    description: Table regroupant la population par region et année.
    columns:
      - name: region
        description: region de résidence de la population
        data_tests:
          - not_null
      - name: year
        description: année du recensement
        data_tests:
          - not_null
      - name: total_population
        description: Population totale sur cette region et cet année
        data_tests:
          - not_null
      - name: pct_population_per_year
        description: Pourcentage de la population de cette region sur l'année
        data_tests:
          - not_null